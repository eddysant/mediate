name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # 3.9 is the floor declared in pyproject.toml; test it so the floor
        # stays honest, and the current stable release alongside it.
        python-version: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install media tools (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg webp
          fi
          ffmpeg -hide_banner -encoders 2>&1 | grep -q libx264
      - name: Install media tools (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_REQUIRE_TAP_TRUST: 1
          HOMEBREW_NO_ENV_HINTS: 1
        run: |
          brew install ffmpeg webp libavif
      - name: Run unit tests
        env:
          MEDIATE_CONFIG: /nonexistent
        run: python -m unittest discover tests -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Check the tag matches the packaged version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG=$(python -c 'import mediate; print(mediate.__version__)')
          PROJ=$(python -c 'import tomllib,pathlib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          echo "tag=$VERSION mediate.__version__=$PKG pyproject=$PROJ"
          if [ "$PKG" != "$VERSION" ] || [ "$PROJ" != "$VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __init__.py ($PKG) and/or pyproject.toml ($PROJ); bump both before tagging"
            exit 1
          fi
      - name: Build zipapp
        id: zipapp
        run: |
          mkdir -p build/zipapp dist
          cp -R mediate build/zipapp/mediate
          printf 'import sys\n\nfrom mediate.cli import main\n\nsys.exit(main())\n' > build/zipapp/__main__.py
          python -m zipapp build/zipapp -o dist/mediate.pyz -p "/usr/bin/env python3" -c
          chmod +x dist/mediate.pyz
          # The built artifact must report the version it is released under.
          test "$(./dist/mediate.pyz --version)" = "mediate ${{ steps.version.outputs.version }}"
          echo "sha256=$(sha256sum dist/mediate.pyz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/mediate.pyz \
            --title "mediate ${{ steps.version.outputs.version }}" \
            --generate-notes
