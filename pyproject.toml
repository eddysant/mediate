[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediate"
version = "0.17.0"
description = "Recursively standardize a macOS media library: photos to lossless WebP, videos and animated GIFs to compatible MP4, with strict validation before deleting originals."
requires-python = ">=3.10"
authors = [{ name = "Eddy Sant" }]
license = { text = "MIT" }
classifiers = [
  "Environment :: MacOS X",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Graphics Conversion",
  "Topic :: Multimedia :: Video :: Conversion",
]

[project.scripts]
mediate = "mediate.cli:main"

[tool.setuptools.packages.find]
include = ["mediate*"]
